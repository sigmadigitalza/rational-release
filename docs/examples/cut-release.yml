# Example consumer wrapper. Drop into your repo as
# .github/workflows/cut-release.yml.

name: Cut Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cut:
    uses: sigmadigitalza/rational-release/.github/workflows/cut-release.yml@v1
    with:
      # Mirror the canonical changelog to a docs page (final version,
      # not the [Unreleased] preview).
      mirror-paths: |
        CHANGELOG.md:docs/server/12-changelog.md

      # Anything else the cut commit should carry alongside the
      # finalised changelog.
      commit-paths: |
        ui/search-index.json

      # Build artefacts after the tag is cut. $VERSION and $PREV_TAG
      # are exposed to the shell here.
      artefact-task: |
        deno task package
        tar -czf "release-notes-v${VERSION}.tar.gz" CHANGELOG.md docs/

      # Globs of files to attach to the GitHub Release.
      artefact-paths: |
        dist/*.tar.gz
        release-notes-v*.tar.gz
