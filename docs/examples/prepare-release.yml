# Example consumer wrapper. Drop into your repo as
# .github/workflows/prepare-release.yml.

name: Prepare Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    uses: sigmadigitalza/rational-release/.github/workflows/prepare-release.yml@v1
    with:
      # Most projects override only these:
      pre1-cap: true

      # Gate the release PR on the same checks you'd want a contributor
      # PR to pass. If any pre-task fails, no release PR is opened.
      # Add or remove lines as your project demands. The reusable exposes
      # `$RR_NEXT_VERSION` and `$RR_PREV_TAG` to pre-tasks so you can,
      # for example, regenerate a docs/changelog.html that already
      # attributes the staged commits to the upcoming release:
      pre-tasks: |
        deno fmt --check
        deno lint
        deno check mod.ts
        deno test --allow-read --allow-net
        deno run -A jsr:@sigmadigitalza/rational-release build-changelog --format html --output docs/changelog.html --next-version "$RR_NEXT_VERSION"

      # Anything generated by `pre-tasks` that should be committed into
      # the release branch (alongside the manifest bump and changelog).
      commit-paths: |
        ui/search-index.json
        docs/changelog.html

      # Optional: mirror the canonical changelog to a docs page.
      mirror-paths: |
        CHANGELOG.md:docs/server/12-changelog.md
