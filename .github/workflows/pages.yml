# Deploy the static docs/ site to GitHub Pages.
#
# First-run setup: in repo Settings → Pages, set "Source" to "GitHub
# Actions". After that, the docs site redeploys whenever Cut Release
# completes successfully — release-prepare.yml regenerates
# docs/changelog.html as part of release prep, so by the time Cut
# Release merges to main and finishes, the docs/ tree is in sync with
# the just-cut version.
#
# `workflow_dispatch` remains available for manual redeploys (e.g.
# fixing a typo in tutorial.html that doesn't warrant a release).

name: Deploy Pages

on:
  workflow_run:
    workflows: ["Cut Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
