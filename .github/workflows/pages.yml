# Deploy the static docs/ site to GitHub Pages.
#
# First-run setup: in repo Settings → Pages, set "Source" to "GitHub
# Actions". After that, the docs site redeploys whenever Cut Release
# completes successfully — release-prepare.yml regenerates
# docs/changelog.html as part of release prep, so by the time Cut
# Release merges to main and finishes, the docs/ tree is in sync with
# the just-cut version.
#
# `workflow_dispatch` remains available for manual redeploys (e.g.
# fixing a typo in tutorial.html that doesn't warrant a release).

name: Deploy Pages

on:
  workflow_run:
    workflows: ["Cut Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
