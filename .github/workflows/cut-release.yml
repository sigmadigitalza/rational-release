# Reusable: cut a release on merge of a release/* PR.
#
# Called on pull_request:closed from the consumer repo. Fires only when
# the merged PR's head branch matches `^release/v` and the PR was
# actually merged (not just closed). Finalises the changelog, tags the
# version, runs the consumer's artefact-task, and creates a GitHub
# Release with the changelog section as the body and any built
# artefacts attached.

name: rational-release / cut

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: deno.json
      manifest-jsonpath:
        type: string
        default: $.version
      release-branch-prefix:
        type: string
        default: release/v
      changelog-path:
        type: string
        default: CHANGELOG.md
      mirror-paths:
        type: string
        default: ""
      commit-paths:
        type: string
        default: ""
      artefact-task:
        description: "Shell command run after the tag is created (e.g. `deno task package`)."
        type: string
        default: ""
      artefact-paths:
        description: "Newline-separated globs to attach to the GitHub Release."
        type: string
        default: ""
      cli:
        description: "Source for the rational-release CLI. A JSR specifier (default) or a local filesystem path. Use a path to dogfood an in-tree CLI."
        type: string
        default: "jsr:@sigmadigitalza/rational-release@^1"
      runs-on:
        type: string
        default: ubuntu-latest

permissions:
  contents: write
  pull-requests: read

jobs:
  cut:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Resolve version from branch name
        id: version
        shell: bash
        env:
          PREFIX: ${{ inputs.release-branch-prefix }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#${PREFIX}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch ${HEAD_REF} did not yield a valid semver after stripping ${PREFIX}"
            exit 1
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "### 🏷️ Release version: \`v${version}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cross-check version against manifest
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest-path }}
          JSONPATH: ${{ inputs.manifest-jsonpath }}
          VERSION: ${{ steps.version.outputs.version }}
          CLI: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          actual=$(deno run --allow-read "$CLI" read-version "$MANIFEST" --jsonpath "$JSONPATH")
          if [ -z "$actual" ]; then
            echo "::error::read-version returned empty string from ${MANIFEST}"
            exit 1
          fi
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::Branch says v${VERSION} but ${MANIFEST} has ${actual}. Refusing to cut."
            exit 1
          fi

      - name: Refuse to re-tag existing version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists locally."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "::error::Tag v${VERSION} already exists on origin."
            exit 1
          fi

      - name: Resolve previous release tag
        id: prev
        shell: bash
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Finalise changelog
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          CHANGELOG: ${{ inputs.changelog-path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: deno run --allow-read --allow-write "$CLI" changelog-finalise "$CHANGELOG" "$VERSION"

      - name: Mirror changelog
        if: inputs.mirror-paths != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            src="${line%%:*}"
            dst="${line#*:}"
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst"
          done <<< "${{ inputs.mirror-paths }}"

      - name: Extract release notes for this version
        id: notes
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          CHANGELOG: ${{ inputs.changelog-path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          deno run --allow-read "$CLI" extract-section "$CHANGELOG" "$VERSION" > release-notes.md
          [ -s release-notes.md ] || echo "_See changelog for details._" > release-notes.md

      - name: Stage and commit finalisation
        id: stage
        shell: bash
        env:
          CHANGELOG: ${{ inputs.changelog-path }}
          MIRRORS: ${{ inputs.mirror-paths }}
          EXTRAS: ${{ inputs.commit-paths }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git add "$CHANGELOG"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            dst="${line#*:}"
            [ -e "$dst" ] && git add "$dst"
          done <<< "$MIRRORS"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ -e "$p" ] && git add "$p"
          done <<< "$EXTRAS"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): finalise v${VERSION}"
            # Retry push up to 3 times to handle transient network failures.
            for attempt in 1 2 3; do
              git push origin HEAD && break
              echo "::warning::git push attempt $attempt failed, retrying in 5s…"
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v${VERSION}"
          # Retry push up to 3 times to handle transient network failures.
          for attempt in 1 2 3; do
            git push origin "v${VERSION}" && break
            echo "::warning::tag push attempt $attempt failed, retrying in 5s…"
            sleep 5
          done

      - name: Run artefact-task
        if: inputs.artefact-task != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::group::$line"
            eval "$line"
            echo "::endgroup::"
          done <<< "${{ inputs.artefact-task }}"

      - name: Append PRs since previous tag to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ]; then
            since=$(git log -1 --format=%ct "$PREV_TAG")
            compare="${PREV_TAG}...v${VERSION}"
          else
            since=0
            compare=""
          fi
          {
            echo
            echo "### Pull requests in this release"
            echo
            # Retry gh API call up to 3 times to handle transient failures.
            for attempt in 1 2 3; do
              gh pr list --state merged --base "${GITHUB_REF_NAME:-main}" --limit 200 \
                --json number,title,author,mergedAt \
                --jq "[ .[] | select((.mergedAt | fromdateiso8601) > $since) ] | .[] | \"- \(.title) (#\(.number) by @\(.author.login))\"" && break
              echo "::warning::gh pr list attempt $attempt failed, retrying in 5s…" >&2
              sleep 5
            done
            if [ -n "$compare" ]; then
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${compare}"
            fi
          } >> release-notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTEFACTS: ${{ inputs.artefact-paths }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r glob; do
            [ -z "$glob" ] && continue
            for f in $glob; do
              [ -e "$f" ] && assets+=( "$f" )
            done
          done <<< "$ARTEFACTS"
          # Retry release creation up to 3 times to handle transient API failures.
          for attempt in 1 2 3; do
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file release-notes.md \
              "${assets[@]}" && break
            echo "::warning::gh release create attempt $attempt failed, retrying in 5s…"
            sleep 5
          done
          echo "### ✅ GitHub Release \`v${VERSION}\` created" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete release branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin --delete "$HEAD_REF" || true
