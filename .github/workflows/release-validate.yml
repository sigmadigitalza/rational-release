# Wrapper: validate PR titles and commit messages on every PR.
# Dogfoods rational-release/validate-pr.yml against this repo and gates
# merges on conventional-commits compliance.

name: Validate PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-commits:
    uses: ./.github/workflows/validate-pr.yml
    with:
      gate: true
      validate-commits: true
      base-ref: ${{ github.sha }}
