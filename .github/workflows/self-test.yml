# CI for the rational-release repo itself: lint, type-check, run the
# CLI test suite. The release flow lives in release.yml — this workflow
# only validates that the CLI is healthy.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # workflow_dispatch lets prepare-release re-trigger CI against the
  # release branch — bot-authored pushes via GITHUB_TOKEN don't fire
  # `pull_request:synchronize`, so without this the release PR's `ci`
  # check would never appear. See `post-push-workflows` input in
  # prepare-release.yml.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# setup-deno's cache restore (@actions/cache 4.0.3) races each download
# segment against a SEGMENT_DOWNLOAD_TIMEOUT_MINS timer (default 10) and
# clears it only on success. A failed restore leaves the timer holding the
# step open for the full 10 minutes, so the job hits timeout-minutes and is
# cancelled. One minute fails the restore fast; the job runs uncached.
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
          cache: true
      - run: deno task ci
