# Reusable: prepare a release PR.
#
# Called on push-to-main from the consumer repo. Computes the next
# semver from conventional-commit subjects since the previous tag,
# regenerates the [Unreleased] section of CHANGELOG.md, mirrors the
# changelog into any extra paths, and force-pushes a release/vX.Y.Z
# branch with a "Release vX.Y.Z" PR open against main.
#
# See docs/examples/prepare-release.yml for a wrapper.

name: rational-release / prepare

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: deno.json
      manifest-jsonpath:
        type: string
        default: $.version
      pre1-cap:
        description: "Cap pre-1.0 major bumps to minor (a `feat!:` on 0.x stays 0.(x+1).0)."
        type: boolean
        default: false
      patch-types:
        description: "Comma-separated extra commit types to treat as patch (e.g. `refactor,build`). Built-in `fix` / `perf` always apply."
        type: string
        default: ""
      minor-types:
        description: "Comma-separated extra commit types to treat as minor. Built-in `feat` always applies. Wins over `patch-types` for the same type."
        type: string
        default: ""
      release-branch-prefix:
        type: string
        default: release/v
      pre-tasks:
        description: "Newline-separated shell commands to run before changelog gen (e.g. `deno task test`)."
        type: string
        default: ""
      commit-paths:
        description: "Newline-separated extra paths to git-add into the prep commit (e.g. `ui/search-index.json`)."
        type: string
        default: ""
      mirror-paths:
        description: "Newline-separated `src:dst` pairs to copy after CHANGELOG is regenerated."
        type: string
        default: ""
      changelog-path:
        type: string
        default: CHANGELOG.md
      bootstrap-changelog:
        description: "Auto-create a Keep-a-Changelog skeleton at changelog-path if it doesn't exist."
        type: boolean
        default: true
      cli:
        description: "Source for the rational-release CLI. A JSR specifier (default) or a local filesystem path. Use a path to dogfood an in-tree CLI."
        type: string
        default: "jsr:@sigmadigitalza/rational-release@^1"
      runs-on:
        type: string
        default: ubuntu-latest

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Explicit fetch-tags is required even with fetch-depth: 0.
          # Without this, when prepare-release fires immediately after
          # a cut-release that just pushed `vX.Y.Z`, the new tag is
          # absent from the local clone and `git tag --list` returns
          # empty — so we incorrectly treat this as the first release
          # and re-walk all commits from the start of history,
          # producing a release PR with already-shipped PR titles.
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
          cache: true

      - name: Resolve previous release tag
        id: prev
        shell: bash
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            echo "Previous release: $prev"
          else
            echo "No previous release tag — this will be the first."
          fi

      - name: Collect commit subjects since previous tag
        shell: bash
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --format=%s > commits.txt
          else
            git log --format=%s > commits.txt
          fi
          echo "Found $(wc -l < commits.txt | tr -d ' ') commit subject(s)."

      - name: Compute next version
        id: bump
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest-path }}
          JSONPATH: ${{ inputs.manifest-jsonpath }}
          PRE1: ${{ inputs.pre1-cap }}
          PATCH_TYPES: ${{ inputs.patch-types }}
          MINOR_TYPES: ${{ inputs.minor-types }}
          CLI: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          current=$(deno run --allow-read "$CLI" read-version "$MANIFEST" --jsonpath "$JSONPATH")
          if [ -z "$current" ]; then
            echo "::error::read-version returned empty string from ${MANIFEST}"
            exit 1
          fi
          flags=( --jsonpath "$JSONPATH" --commits-file commits.txt )
          [ "$PRE1" = "true" ] && flags+=( --pre-1.0-cap )
          [ -n "$PATCH_TYPES" ] && flags+=( --patch-types "$PATCH_TYPES" )
          [ -n "$MINOR_TYPES" ] && flags+=( --minor-types "$MINOR_TYPES" )
          next=$(deno run --allow-read "$CLI" next-version "$MANIFEST" "${flags[@]}")
          if [ -z "$next" ]; then
            echo "::error::next-version returned empty string"
            exit 1
          fi
          echo "current=$current" | tee -a "$GITHUB_OUTPUT"
          echo "next=$next" | tee -a "$GITHUB_OUTPUT"
          if [ "$current" = "$next" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "### 📦 Version bump: \`${current}\` → \`${next}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect release-merge commit
        id: rm_guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Detect whether the triggering commit is the merge commit
          # of a `release/v*` PR. cut-release is already running for
          # the same SHA in that case and will push `vX.Y.Z` shortly.
          # Without this guard, prepare-release races cut-release: if
          # `git tag --list` runs before the new tag lands on origin,
          # prev-tag is empty and we re-walk all of history into a
          # phantom "Release v(N+1)" PR regurgitating commits that
          # were just shipped. fetch-tags on checkout (above) is
          # necessary but not sufficient — there is nothing to fetch
          # yet at this instant.
          #
          # The prefix is hardcoded `release/v` to mirror cut-release's
          # job gate (`startsWith(...head.ref, 'release/v')`); the
          # `release-branch-prefix` input is required to start with
          # `release/v` per the README. Anchoring here too means a
          # repo that overrides the suffix can't end up with
          # prepare-release skipping while cut-release also doesn't
          # fire — both gates use the same anchor.
          #
          # Retry up to 3 times. If the API is persistently unreachable,
          # fall back to skip=false (the original racy-but-correct-most-
          # of-the-time behaviour) rather than blocking the release.
          head_ref=""
          for attempt in 1 2 3; do
            if out=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[] | select(.merged_at != null) | .head.ref'); then
              head_ref=$(printf '%s\n' "$out" | awk '/^release\/v/ {print; exit}')
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::gh api commits/${GITHUB_SHA}/pulls failed after 3 attempts — release-merge guard inactive, proceeding"
            else
              echo "::warning::gh api attempt $attempt failed, retrying in 5s…"
              sleep 5
            fi
          done
          if [ -n "$head_ref" ]; then
            echo "Triggering commit is the merge of ${head_ref} — cut-release will handle this. Skipping prepare-release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "head-ref=$head_ref" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ Skipped: triggering commit is a release-merge (\`${head_ref}\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bail out if nothing to release
        id: gate
        shell: bash
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          CURRENT: ${{ steps.bump.outputs.current }}
          BUMPED: ${{ steps.bump.outputs.bumped }}
          GUARD_SKIP: ${{ steps.rm_guard.outputs.skip }}
          GUARD_HEAD_REF: ${{ steps.rm_guard.outputs.head-ref }}
          CLI: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          # Bridge the release-merge guard into the existing proceed/
          # reason output that downstream steps already gate on.
          if [ "$GUARD_SKIP" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=release-merge commit (${GUARD_HEAD_REF})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deno run --allow-read --allow-env --allow-write="$GITHUB_OUTPUT" \
            "$CLI" release-gate \
              --prev-tag "$PREV_TAG" \
              --current "$CURRENT" \
              --bumped "$BUMPED"

      - name: Run pre-tasks
        if: steps.gate.outputs.proceed == 'true' && inputs.pre-tasks != ''
        # Expose the computed bump so user pre-tasks (e.g. regenerating
        # docs/changelog.html) can attribute commits to the upcoming
        # release rather than the Unreleased bucket. RR_PREV_TAG is the
        # tag the bump is being computed against (empty on first release).
        #
        # Security: the task block is executed in a single subshell via
        # stdin (not eval), so state (cd, variables) persists across lines
        # while still avoiding eval-based injection surfaces. Inputs come
        # from the caller's workflow file (trusted).
        shell: bash
        env:
          RR_NEXT_VERSION: ${{ steps.bump.outputs.next }}
          RR_PREV_TAG: ${{ steps.prev.outputs.tag }}
          PRE_TASKS: ${{ inputs.pre-tasks }}
        run: |
          set -euo pipefail
          bash -euo pipefail <<< "$PRE_TASKS"

      - name: Apply version bump to manifest
        if: steps.gate.outputs.proceed == 'true' && steps.bump.outputs.bumped == 'true'
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest-path }}
          JSONPATH: ${{ inputs.manifest-jsonpath }}
          NEXT: ${{ steps.bump.outputs.next }}
          CLI: ${{ inputs.cli }}
        run: deno run --allow-read --allow-write "$CLI" set-version "$MANIFEST" "$NEXT" --jsonpath "$JSONPATH"

      - name: Collect merged PRs for changelog
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ]; then
            since=$(git log -1 --format=%ct "$PREV_TAG")
          else
            since=0
          fi
          # Retry gh API call up to 3 times to handle transient failures.
          for attempt in 1 2 3; do
            if gh pr list --base "${GITHUB_REF_NAME:-main}" --state merged --limit 200 \
              --json number,title,mergedAt,author \
              --jq "[ .[] | select((.mergedAt | fromdateiso8601) > $since) ]" \
              > prs.json; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::gh pr list failed after 3 attempts"; exit 1; fi
            echo "::warning::gh pr list attempt $attempt failed, retrying in 5s…"
            sleep 5
          done

      - name: Regenerate [Unreleased] section
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          CHANGELOG: ${{ inputs.changelog-path }}
          BOOTSTRAP: ${{ inputs.bootstrap-changelog }}
        run: |
          set -euo pipefail
          flags=()
          [ "$BOOTSTRAP" = "true" ] && flags+=( --bootstrap )
          deno run --allow-read --allow-write "$CLI" changelog-generate prs.json "$CHANGELOG" "${flags[@]}"

      - name: Mirror changelog
        if: steps.gate.outputs.proceed == 'true' && inputs.mirror-paths != ''
        shell: bash
        env:
          MIRROR_PATHS: ${{ inputs.mirror-paths }}
          CLI: ${{ inputs.cli }}
        run: deno run --allow-read --allow-write --allow-env "$CLI" mirror

      - name: Stage and commit prep changes
        id: stage
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest-path }}
          CHANGELOG: ${{ inputs.changelog-path }}
          MIRRORS: ${{ inputs.mirror-paths }}
          EXTRAS: ${{ inputs.commit-paths }}
          BUMPED: ${{ steps.bump.outputs.bumped }}
        run: |
          set -euo pipefail
          [ "$BUMPED" = "true" ] && git add "$MANIFEST"
          git add "$CHANGELOG"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            dst="${line#*:}"
            [ -e "$dst" ] && git add "$dst"
          done <<< "$MIRRORS"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ -e "$p" ] && git add "$p"
          done <<< "$EXTRAS"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): prep v${{ steps.bump.outputs.next }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Force-push release branch
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          PREFIX: ${{ inputs.release-branch-prefix }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          # Retry push up to 3 times to handle transient network failures.
          for attempt in 1 2 3; do
            if git push --force origin "HEAD:refs/heads/${PREFIX}${NEXT}"; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::git push failed after 3 attempts"; exit 1; fi
            echo "::warning::git push attempt $attempt failed, retrying in 5s…"
            sleep 5
          done

      - name: Extract [Unreleased] for PR body
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          CHANGELOG: ${{ inputs.changelog-path }}
          CLI: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          deno run --allow-read "$CLI" extract-section "$CHANGELOG" Unreleased \
            > unreleased.md
          [ -s unreleased.md ] || echo "_No entries in [Unreleased]._" > unreleased.md

      - name: Open or update release PR
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ inputs.release-branch-prefix }}
          NEXT: ${{ steps.bump.outputs.next }}
          PREV_VERSION: ${{ steps.bump.outputs.current }}
        run: |
          set -euo pipefail
          branch="${PREFIX}${NEXT}"
          title="Release v${NEXT}"
          {
            echo "## Release v${NEXT}"
            echo
            echo "Auto-bumped from \`${PREV_VERSION}\` based on conventional commits since the previous release."
            echo
            echo "Merging this PR will tag \`v${NEXT}\` and publish a GitHub Release."
            echo
            echo "### Changelog preview"
            echo
            cat unreleased.md
          } > body.md

          existing=$(gh pr list --head "$branch" --base "${GITHUB_REF_NAME:-main}" --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file body.md
            echo "### 🔄 Updated release PR #${existing}" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base "${GITHUB_REF_NAME:-main}" --head "$branch" --title "$title" --body-file body.md
            echo "### 🆕 Opened release PR for v${NEXT}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Supersede stale release PRs
        # All untrusted-input concerns are routed through env: vars
        # (PREFIX from workflow_call inputs, NEXT from a computed semver
        # string). No github.event.* fields appear in the run script.
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ inputs.release-branch-prefix }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          # Bug shape this prevents: when a new commit lands between
          # prepare-release runs and escalates the implied bump tier
          # (e.g. a feat: arrives while a release/v0.9.1 patch PR is
          # still open), the new release branch is version-named
          # (release/v0.10.0). "Open or update release PR" above keys
          # "existing PR" by the new branch name, so it opens a
          # parallel PR — the earlier release PR keeps its outdated
          # changelog snapshot and stale manifest version. If the
          # stale PR is merged anyway, cut-release derives the version
          # from the merged branch name without recomputing, shipping
          # a release under-classified against current main.
          #
          # Close any open release PRs (branches starting with PREFIX)
          # whose head differs from the version we just computed, and
          # delete the abandoned branch via --delete-branch. The new
          # PR is already open at this point, so a failure here only
          # leaves manual cleanup — the primary release flow is safe.
          branch="${PREFIX}${NEXT}"
          if [ -z "${PREFIX}" ]; then
            echo "::warning::release-branch-prefix is empty; skipping stale PR sweep to avoid closing unrelated PRs"
          else
            # --limit 200: well above any realistic open-release-PR count;
            # avoids silent truncation at the CLI default (30).
            stale_prs=$(gh pr list \
              --base "${GITHUB_REF_NAME:-main}" --state open \
              --limit 200 \
              --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"${PREFIX}\")) | select(.headRefName != \"${branch}\") | [.number, .headRefName] | @tsv")
            while IFS=$'\t' read -r num head_ref; do
              # Skip blank lines that can arise from an empty here-string.
              [ -z "$num" ] && continue
              echo "Superseding stale release PR #${num} (head=${head_ref}) by v${NEXT}…"
              if gh pr close "$num" \
                --comment "Superseded by the v${NEXT} release PR — the implied bump escalated since this PR was opened." \
                --delete-branch; then
                echo "### 🧹 Superseded stale release PR #${num} (was \`${head_ref}\`)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::failed to close stale PR #${num} (head=${head_ref}); leaving for manual cleanup"
              fi
            done <<< "$stale_prs"
          fi
