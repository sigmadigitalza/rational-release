# Reusable: prepare a release PR.
#
# Called on push-to-main from the consumer repo. Computes the next
# semver from conventional-commit subjects since the previous tag,
# regenerates the [Unreleased] section of CHANGELOG.md, finalises it
# into the `[X.Y.Z] - date` release section (leaving a fresh empty
# [Unreleased] above it), mirrors the changelog into any extra paths,
# and force-pushes a release/vX.Y.Z branch with a "Release vX.Y.Z" PR
# open against main.
#
# Finalising here — rather than at cut time — means the merged release
# PR already carries the finalised changelog, so cut-release has nothing
# to commit and never needs push access to a protected main branch
# (GH006 "Protected branch update failed" made cut-release die after the
# release PR merged, stranding the manifest ahead of the tags).
#
# See docs/examples/prepare-release.yml for a wrapper.

name: rational-release / prepare

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: deno.json
      manifest-jsonpath:
        type: string
        default: $.version
      pre1-cap:
        description: "Cap pre-1.0 major bumps to minor (a `feat!:` on 0.x stays 0.(x+1).0)."
        type: boolean
        default: false
      patch-types:
        description: "Comma-separated extra commit types to treat as patch (e.g. `refactor,build`). Built-in `fix` / `perf` always apply."
        type: string
        default: ""
      minor-types:
        description: "Comma-separated extra commit types to treat as minor. Built-in `feat` always applies. Wins over `patch-types` for the same type."
        type: string
        default: ""
      release-branch-prefix:
        type: string
        default: release/v
      pre-tasks:
        description: "Newline-separated shell commands to run before changelog gen (e.g. `deno task test`)."
        type: string
        default: ""
      commit-paths:
        description: "Newline-separated extra paths to git-add into the prep commit (e.g. `ui/search-index.json`)."
        type: string
        default: ""
      mirror-paths:
        description: "Newline-separated `src:dst` pairs to copy after CHANGELOG is regenerated."
        type: string
        default: ""
      changelog-path:
        type: string
        default: CHANGELOG.md
      bootstrap-changelog:
        description: "Auto-create a Keep-a-Changelog skeleton at changelog-path if it doesn't exist."
        type: boolean
        default: true
      cli:
        description: "Source for the rational-release CLI. A JSR specifier (default) or a local filesystem path. Use a path to dogfood an in-tree CLI."
        type: string
        default: "jsr:@sigmadigitalza/rational-release@^1"
      post-push-workflows:
        description: "Newline-separated workflow names to dispatch on the release branch after force-push, to re-trigger checks that don't fire on bot-authored pushes (anti-loop GitHub Actions suppression). Each workflow must declare a `workflow_dispatch:` trigger."
        type: string
        default: ""
      runs-on:
        type: string
        default: ubuntu-latest

permissions:
  contents: write
  pull-requests: write
  # actions: write is needed by the optional "Dispatch post-push
  # workflows" step (`gh workflow run` requires the token to have
  # Actions write). Harmless on calls that don't use that input.
  actions: write

jobs:
  prepare:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # fetch-tags is needed even with fetch-depth: 0 — without it
          # `git tag --list` can race a just-pushed vX.Y.Z and re-walk
          # history into a phantom next-release PR.
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
          cache: true

      - name: Resolve previous release tag
        id: prev
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
        run: |
          deno run --allow-env --allow-run=git \
            --allow-write="$GITHUB_OUTPUT" \
            "$CLI" prev-tag

      - name: Collect commit subjects since previous tag
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          deno run --allow-env --allow-run=git --allow-write=commits.txt \
            "$CLI" collect-commits --prev-tag "$PREV_TAG" --out commits.txt

      - name: Compute next version
        id: bump
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          MANIFEST: ${{ inputs.manifest-path }}
          JSONPATH: ${{ inputs.manifest-jsonpath }}
          PRE1: ${{ inputs.pre1-cap }}
          PATCH_TYPES: ${{ inputs.patch-types }}
          MINOR_TYPES: ${{ inputs.minor-types }}
        run: |
          flags=( --commits-file commits.txt --jsonpath "$JSONPATH" )
          [ "$PRE1" = "true" ] && flags+=( --pre-1.0-cap )
          [ -n "$PATCH_TYPES" ] && flags+=( --patch-types "$PATCH_TYPES" )
          [ -n "$MINOR_TYPES" ] && flags+=( --minor-types "$MINOR_TYPES" )
          deno run --allow-read --allow-env \
            --allow-write="$GITHUB_OUTPUT,$GITHUB_STEP_SUMMARY" \
            "$CLI" compute-next-version "$MANIFEST" "${flags[@]}"

      - name: Detect release-merge commit
        # Race guard against cut-release firing on the same SHA. See
        # cli/detect_release_merge.ts for the why + retry behaviour.
        id: rm_guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI: ${{ inputs.cli }}
        run: |
          deno run --allow-env --allow-run=gh \
            --allow-write="$GITHUB_OUTPUT,$GITHUB_STEP_SUMMARY" \
            "$CLI" detect-release-merge

      - name: Bail out if nothing to release
        # Short-circuits the proceed/reason output when the rm_guard
        # step skipped; otherwise delegates to the release-gate CLI.
        id: gate
        shell: bash
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          CURRENT: ${{ steps.bump.outputs.current }}
          BUMPED: ${{ steps.bump.outputs.bumped }}
          GUARD_SKIP: ${{ steps.rm_guard.outputs.skip }}
          GUARD_HEAD_REF: ${{ steps.rm_guard.outputs.head-ref }}
          CLI: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          if [ "$GUARD_SKIP" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=release-merge commit (${GUARD_HEAD_REF})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deno run --allow-read --allow-env --allow-write="$GITHUB_OUTPUT" \
            "$CLI" release-gate \
              --prev-tag "$PREV_TAG" \
              --current "$CURRENT" \
              --bumped "$BUMPED"

      - name: Run pre-tasks
        # Runs the caller-provided shell block. Exposes RR_NEXT_VERSION
        # and RR_PREV_TAG so tasks can attribute work to the upcoming
        # release. Executed via `<<<` (stdin), not `eval`, so state
        # persists across lines without eval-injection risk; inputs
        # come from the caller's workflow file (trusted).
        if: steps.gate.outputs.proceed == 'true' && inputs.pre-tasks != ''
        shell: bash
        env:
          RR_NEXT_VERSION: ${{ steps.bump.outputs.next }}
          RR_PREV_TAG: ${{ steps.prev.outputs.tag }}
          PRE_TASKS: ${{ inputs.pre-tasks }}
        run: |
          set -euo pipefail
          bash -euo pipefail <<< "$PRE_TASKS"

      - name: Apply version bump to manifest
        if: steps.gate.outputs.proceed == 'true' && steps.bump.outputs.bumped == 'true'
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest-path }}
          JSONPATH: ${{ inputs.manifest-jsonpath }}
          NEXT: ${{ steps.bump.outputs.next }}
          CLI: ${{ inputs.cli }}
        run: deno run --allow-read --allow-write "$CLI" set-version "$MANIFEST" "$NEXT" --jsonpath "$JSONPATH"

      - name: Collect merged PRs for changelog
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI: ${{ inputs.cli }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          deno run --allow-env --allow-run=gh,git --allow-write=prs.json \
            "$CLI" collect-merged-prs --prev-tag "$PREV_TAG" --out prs.json

      - name: Regenerate [Unreleased] section
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          CHANGELOG: ${{ inputs.changelog-path }}
          BOOTSTRAP: ${{ inputs.bootstrap-changelog }}
        run: |
          set -euo pipefail
          flags=()
          [ "$BOOTSTRAP" = "true" ] && flags+=( --bootstrap )
          deno run --allow-read --allow-write "$CLI" changelog-generate prs.json "$CHANGELOG" "${flags[@]}"

      - name: Finalise changelog into the release section
        # Promote [Unreleased] to `[X.Y.Z] - date` on the release branch
        # itself (a fresh empty [Unreleased] is left above it). The merge
        # of the release PR then delivers the finalised changelog to main,
        # so cut-release never has to push a finalisation commit — which a
        # protected main would reject (GH006).
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          CHANGELOG: ${{ inputs.changelog-path }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: deno run --allow-read --allow-write "$CLI" changelog-finalise "$CHANGELOG" "$NEXT"

      - name: Mirror changelog
        if: steps.gate.outputs.proceed == 'true' && inputs.mirror-paths != ''
        shell: bash
        env:
          MIRROR_PATHS: ${{ inputs.mirror-paths }}
          CLI: ${{ inputs.cli }}
        run: deno run --allow-read --allow-write --allow-env "$CLI" mirror

      - name: Stage and commit prep changes
        id: stage
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          MANIFEST: ${{ inputs.manifest-path }}
          CHANGELOG: ${{ inputs.changelog-path }}
          MIRRORS: ${{ inputs.mirror-paths }}
          EXTRAS: ${{ inputs.commit-paths }}
          BUMPED: ${{ steps.bump.outputs.bumped }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          flags=()
          [ "$BUMPED" = "true" ] && flags+=( --bumped )
          deno run --allow-env --allow-read --allow-run=git \
            --allow-write="$GITHUB_OUTPUT" \
            "$CLI" stage-prep \
              --manifest "$MANIFEST" \
              --changelog "$CHANGELOG" \
              --version "$NEXT" \
              --mirrors "$MIRRORS" \
              --extras "$EXTRAS" \
              "${flags[@]}"

      - name: Force-push release branch
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          CLI: ${{ inputs.cli }}
          PREFIX: ${{ inputs.release-branch-prefix }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          deno run --allow-env --allow-run=git \
            "$CLI" force-push --refspec "HEAD:refs/heads/${PREFIX}${NEXT}"

      - name: Extract release section for PR body
        # The changelog is already finalised on this branch, so the release
        # notes live under `[X.Y.Z]`, not `[Unreleased]`.
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          CHANGELOG: ${{ inputs.changelog-path }}
          CLI: ${{ inputs.cli }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          deno run --allow-read "$CLI" \
            extract-section "$CHANGELOG" "$NEXT" \
            --fallback "_No changelog entries._" > unreleased.md

      - name: Open or update release PR
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI: ${{ inputs.cli }}
          PREFIX: ${{ inputs.release-branch-prefix }}
          NEXT: ${{ steps.bump.outputs.next }}
          PREV_VERSION: ${{ steps.bump.outputs.current }}
        run: |
          deno run --allow-env --allow-read=unreleased.md --allow-run=gh \
            --allow-write="body.md,$GITHUB_STEP_SUMMARY" \
            "$CLI" open-or-update-pr \
              --head "${PREFIX}${NEXT}" \
              --version "$NEXT" \
              --prev-version "$PREV_VERSION" \
              --unreleased-from unreleased.md \
              --body-file body.md

      - name: Supersede stale release PRs
        # Close parallel release/v* PRs left over from a bump-tier
        # escalation. See cli/supersede_stale.ts.
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI: ${{ inputs.cli }}
          PREFIX: ${{ inputs.release-branch-prefix }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          deno run --allow-env --allow-run=gh \
            --allow-write="$GITHUB_STEP_SUMMARY" \
            "$CLI" supersede-stale \
              --prefix "$PREFIX" \
              --current "${PREFIX}${NEXT}" \
              --version "$NEXT"

      - name: Dispatch post-push workflows on release branch
        # workflow_dispatch is the one trigger that isn't suppressed
        # when GITHUB_TOKEN is the pusher — re-fire each named
        # workflow so its status check attaches to the release-PR
        # head commit. See cli/dispatch_workflows.ts.
        if: steps.gate.outputs.proceed == 'true' && steps.stage.outputs.changed == 'true' && inputs.post-push-workflows != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI: ${{ inputs.cli }}
          PREFIX: ${{ inputs.release-branch-prefix }}
          NEXT: ${{ steps.bump.outputs.next }}
          WORKFLOWS: ${{ inputs.post-push-workflows }}
        run: |
          deno run --allow-env --allow-run=gh \
            --allow-write="$GITHUB_STEP_SUMMARY" \
            "$CLI" dispatch-workflows --ref "${PREFIX}${NEXT}"
