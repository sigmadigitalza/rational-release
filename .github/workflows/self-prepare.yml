# Wrapper: prepare a release PR using our own reusable workflow.
# Dogfoods rational-release/prepare-release.yml against this repo.
#
# This wrapper exercises three advanced features documented in the
# advanced guide:
#
#   * pre-tasks   — gate the release with `deno fmt --check`, lint,
#                   type-check, and the test suite. If any of these
#                   fail, the release PR is not opened.
#   * pre-tasks   — also generate `docs/changelog.html` from git
#                   history via the CLI's own build-changelog
#                   subcommand. This is the dogfood example: a task
#                   the CLI itself supports as a first-class
#                   capability, run as part of release prep.
#   * commit-paths — commit the generated HTML changelog into the
#                   release branch so the docs site stays in sync
#                   with each release.

name: Prepare Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    uses: ./.github/workflows/prepare-release.yml
    with:
      # Dogfood the in-tree CLI (post-merge HEAD), not the published JSR version.
      cli: ./cli/mod.ts
      pre-tasks: |
        deno fmt --check
        deno lint
        deno check cli/mod.ts
        deno test --allow-read --allow-env --allow-write --allow-run
        deno run --allow-read --allow-write --allow-run --allow-env cli/mod.ts build-changelog --format html --output docs/changelog.html --next-version "$RR_NEXT_VERSION"
      commit-paths: |
        docs/changelog.html
      # Re-trigger CI on the release branch after force-push, since
      # bot-authored pushes via GITHUB_TOKEN don't fire `pull_request:
      # synchronize`. `Validate PR` intentionally stays on the standard
      # `pull_request:` trigger only — the bot-authored release PR
      # title ("Release vX.Y.Z") is not a conventional-commit subject,
      # and gating it as such would always fail.
      post-push-workflows: |
        CI
