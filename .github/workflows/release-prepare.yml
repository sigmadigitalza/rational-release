# Wrapper: prepare a release PR using our own reusable workflow.
# Dogfoods rational-release/prepare-release.yml against this repo.
#
# Advanced features demonstrated:
#   - gate:        release-validate.yml uses gate: true
#   - pre-tasks:   CI + HTML changelog generation
#   - commit-paths: generated docs/changelog.html committed with the release
#   - mirror-paths: CHANGELOG.md copied alongside the HTML version

name: Prepare Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    uses: ./.github/workflows/prepare-release.yml
    with:
      base-ref: ${{ github.sha }}
      pre-tasks: |
        deno task ci
        deno task changelog-html
      commit-paths: |
        docs/changelog.html
