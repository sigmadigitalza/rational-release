# Reusable: validate a PR against the conventional-commits spec.
#
# Two checks, both run via the rational-release CLI:
#   * PR title           — `rational-release validate-title`
#   * Commit-message log — `rational-release validate-commits`
#
# Defaults to report-only — writes pass/fail blocks to the step summary
# but doesn't fail the workflow. Set `gate: true` to turn the checks
# into required statuses that block merge when wired up in branch
# protection.
#
# Machine-generated release PRs (prepare-release's "Release vX.Y.Z")
# are skipped — their title is by design not a conventional commit.
# Normally their bot-pushed branches never trigger pull_request
# workflows at all (anti-loop suppression), but a manually-approved
# held run would otherwise fail the release PR on its own title.

name: rational-release / validate-pr

on:
  workflow_call:
    inputs:
      require-scope:
        type: boolean
        default: false
      release-branch-prefix:
        description: "Head-branch prefix of machine-generated release PRs to skip. Match prepare-release's release-branch-prefix."
        type: string
        default: release/v
      gate:
        description: "Fail the workflow on validation error (vs. report-only)."
        type: boolean
        default: false
      validate-commits:
        description: "Also validate every commit message in the PR."
        type: boolean
        default: true
      cli:
        description: "Source for the rational-release CLI. A JSR specifier (default) or a local filesystem path. Use a path to dogfood an in-tree CLI."
        type: string
        default: "jsr:@sigmadigitalza/rational-release@^1"
      runs-on:
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  validate:
    # Skip prepare-release's own PRs — "Release vX.Y.Z" is not (and
    # should not be) a conventional-commit title.
    if: ${{ !startsWith(github.head_ref, inputs.release-branch-prefix) }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
          cache: true

      - name: Validate PR title
        id: title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          REQUIRE_SCOPE: ${{ inputs.require-scope }}
          GATE: ${{ inputs.gate }}
          CLI: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          flags=( --from-env PR_TITLE )
          [ "$REQUIRE_SCOPE" = "true" ] && flags+=( --require-scope )

          # Capture exit code without aborting the step — we want the
          # commit check to also run before deciding to fail.
          if deno run --allow-read --allow-env --allow-write="$GITHUB_STEP_SUMMARY" \
              "$CLI" validate-title "${flags[@]}"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate commit messages
        id: commits
        if: inputs.validate-commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRE_SCOPE: ${{ inputs.require-scope }}
          CLI: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          # Collect commit subjects in the PR range, separated by a marker
          # the CLI splits on. %x1f (unit separator) appears nowhere in
          # commit subjects, so we use it instead of a literal string.
          git log --format='%s---COMMIT_SEP---' "${BASE_SHA}..${HEAD_SHA}" > commits.txt

          flags=( --commits-file commits.txt --separator '---COMMIT_SEP---' )
          [ "$REQUIRE_SCOPE" = "true" ] && flags+=( --require-scope )

          if deno run --allow-read --allow-env --allow-write="$GITHUB_STEP_SUMMARY" \
              "$CLI" validate-commits "${flags[@]}"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate
        if: inputs.gate
        shell: bash
        env:
          TITLE_OK: ${{ steps.title.outputs.ok }}
          COMMITS_OK: ${{ steps.commits.outputs.ok }}
          COMMITS_RAN: ${{ inputs.validate-commits }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$TITLE_OK" != "true" ]; then
            echo "::error::PR title failed conventional-commits validation."
            fail=1
          fi
          if [ "$COMMITS_RAN" = "true" ] && [ "$COMMITS_OK" != "true" ]; then
            echo "::error::One or more commit messages failed validation."
            fail=1
          fi
          exit "$fail"
