# Reusable: validate a PR title against the conventional commits spec.
#
# Defaults to report-only — writes a pass/fail block to the step summary
# but doesn't fail the workflow. Set `gate: true` to turn the check into
# a required status that blocks merge when wired up in branch protection.

name: rational-release / validate-pr

on:
  workflow_call:
    inputs:
      allowed-types:
        type: string
        default: feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert
      require-scope:
        type: boolean
        default: false
      gate:
        description: "Fail the workflow on invalid title (vs. report-only)."
        type: boolean
        default: false
      base-ref:
        type: string
        default: v1
      runs-on:
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          ALLOWED: ${{ inputs.allowed-types }}
          REQUIRE_SCOPE: ${{ inputs.require-scope }}
          GATE: ${{ inputs.gate }}
          CLI: https://raw.githubusercontent.com/sigmadigitalza/rational-release/${{ inputs.base-ref }}/cli/mod.ts
        run: |
          set -euo pipefail
          flags=( --allowed-types "$ALLOWED" )
          [ "$REQUIRE_SCOPE" = "true" ] && flags+=( --require-scope )
          verdict=$(deno run --allow-read "$CLI" validate-title "$PR_TITLE" "${flags[@]}")
          ok=$(echo "$verdict" | jq -r '.ok')
          reason=$(echo "$verdict" | jq -r '.reason')

          {
            echo "## PR title check"
            echo
            echo "**Title:** \`$PR_TITLE\`"
            echo
            if [ "$ok" = "true" ]; then
              echo "✅ Conforms to Conventional Commits."
            else
              echo "❌ $reason"
              echo
              echo "Expected format: \`type(scope)?!?: description\`. Allowed types: \`$ALLOWED\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ok" != "true" ] && [ "$GATE" = "true" ]; then
            echo "::error::PR title failed validation: $reason"
            exit 1
          fi
